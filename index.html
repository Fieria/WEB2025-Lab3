<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="game-title">2048</h1>
            <div class="header-controls">
                <!-- Кнопки будут добавлены здесь -->
            </div>
        </header>
        
        <div class="game-wrapper">
            <div class="grid-container">
                <!-- 16 пустых ячеек-подложек -->
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
            </div>
            
            <!-- Слой для динамических плиток -->
            <div class="tiles-container" id="tiles-container">
                <!-- Плитки будут добавляться динамически через JavaScript -->
            </div>
        </div>
    </div>
</body>
</html>
